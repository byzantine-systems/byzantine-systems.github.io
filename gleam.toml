lustre         = ">= 5.7.0 and < 6.0.0"
gleam_time     = ">= 1.8.0 and < 2.0.0"
smalto         = ">= 3.0.0 and < 4.0.0"
mork           = ">= 1.12.0 and < 2.0.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
