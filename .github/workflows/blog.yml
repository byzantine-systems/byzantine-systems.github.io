name: "[Blog] Build & Deploy"

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: "[Nix] Build static site"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - uses: cachix/cachix-action@v17
        with:
          name: devenv

      - name: "[Nix] Render Org -> Markdown -> HTML via Blogatto"
        run: |
          nix develop --accept-flake-config --command make run

      - name: "[Pages] Upload artifact"
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: "[Pages] Deploy to GitHub Pages"
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: "[Pages] Deploy"
        id: deployment
        uses: actions/deploy-pages@v5
